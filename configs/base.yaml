# Shared tunable defaults. Task, variant, and experiment overlays are restricted.
schema_version: 1
study:
  variants: [B, D]
  task_families: [relay, cover]
  separate_family_runs: true
  primary_metric: normalized_success_auc
  interaction_unit: joint_transition
  evaluation_enters_replay: false
environment:
  agents: 2
  image_shape: [3, 96, 128]
  render_shape: [120, 160]
  frame_skip: 4
  action_count: 12
  previous_action_start: 12
  local_actor_inputs: [local_rgb, previous_action, local_hidden]
  actor_reward_input: false
  actor_global_input: false
  actor_agent_identity: false
  communication: false
  shared_actor_weights: true
  separate_actor_memory: true
  privileged_mode: auxiliary_targets_only
  prior_future_truth: false
  exact_episode_clock: true
resources:
  requested_gpu_count: 4
  requested_gpu_model: H200
  requested_cpu_cores: 4
  initial_collectors: 2
  learners_per_gpu: 1
  data_loader_workers: 0
  cpu_threads: 1
  mixed_precision: bfloat16
  probability_dtype: float32
  optimizer_dtype: float32
  distributed_training: false
world_model:
  encoder_channels: [32, 64, 128, 256]
  memory_tokens: 16
  width: 256
  transformer_blocks: 4
  attention_heads: 8
  ffn_width: 1024
  latent_variables: 32
  latent_categories: 32
  effective_batch: 32
  sequence_length: 64
  burn_in: 16
  initial_updates: 5000
  online_updates: 500
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip: 100.0
  free_nats: 1.0
  uniform_mixture: 0.01
  recent_fraction: 0.5
  recent_transitions: 100000
  fitting_episode_fraction: 0.9
  loss_weights:
    rgb: 100.0
    reward: 1.0
    outcome: 1.0
    auxiliary: 1.0
    dynamics_kl: 0.5
    representation_kl: 0.1
actor:
  embedding_size: 256
  hidden_size: 256
  dropout: 0.0
critic:
  hidden_sizes: [512, 512]
  actor_memories: true
  remaining_time: true
mappo:
  horizon: 15
  starts: 256
  epochs: 4
  recurrent_minibatches: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  learning_rate: 0.0003
  optimizer_epsilon: 0.00001
  entropy_coefficient: 0.01
  value_coefficient: 0.5
  value_huber_delta: 1.0
  gradient_clip: 0.5
  initial_local_cycles: 100
  online_local_cycles: 20
  normalize_actor_advantages: true
  normalize_values: false
  differentiate_world_model: false
  frozen_rollout_snapshots: true
teacher:
  initial_cycles: 100
  online_cycles: 20
  attention_heads: 4
  head_width: 256
  recurrent_input: local_history
distillation:
  target: soft_action_distribution
  direction: teacher_to_student_forward_kl
  trajectory_source: student
  temperature: 1.0
  initial_trajectories: 512
  warm_start_updates: 200
  warm_start_batch_sequences: 64
  initial_weight: 1.0
  decay_fraction: 0.75
