schema_version: 1
version: cooperative-layout-splits-v1
randomization_version: cooperative-randomization-banks-v1
geometry_scope: >-
  Held-out corridor and arena lengths, gate locations, and pillar arrangements
  within the authored relay/two-console task topologies. Test geometry is not
  sampled from training templates. This is not arbitrary-map, new-topology,
  new-weapon, or new-enemy-class generalization.
split_counts: {train: 6, validation: 2, test: 2}
banks:
  relay-shared-v1:
    version: relay-randomization-v1
    task_family: relay
    role_assignment: seeded_swap
    spawn_pairs:
      - {operator: [64, 96], runner: [64, 352]}
      - {operator: [80, 96], runner: [80, 352]}
      - {operator: [96, 96], runner: [96, 352]}
    wall_textures: [STARTAN3, BROWN1, STONE2]
    enemy_positions: [[]]
  cover-shared-v1:
    version: cover-randomization-v1
    task_family: cover
    role_assignment: seeded_swap
    spawn_pairs:
      - {operator: [192, 192], runner: [192, 352]}
      - {operator: [160, 192], runner: [160, 352]}
      - {operator: [224, 192], runner: [224, 352]}
    wall_textures: [STARTAN3, BROWN1, STONE2]
    enemy_positions:
      - [[704, 192], [256, 576]]
      - [[736, 192], [224, 576]]
      - [[768, 192], [288, 576]]
templates:
  relay:
    - id: relay_train_00
      split: train
      bank: relay-shared-v1
      geometry: {common_x: 768, gate_x: 256, obstacles: [[384, 128], [448, 256]]}
