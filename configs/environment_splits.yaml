      geometry: {common_x: 960, gate_x: 256, obstacles: [[448, 128], [640, 256]]}
    - id: relay_train_04
      split: train
      bank: relay-shared-v1
      geometry: {common_x: 1024, gate_x: 320, obstacles: [[576, 128], [704, 256]]}
    - id: relay_train_05
      split: train
      bank: relay-shared-v1
      geometry: {common_x: 1088, gate_x: 384, obstacles: [[640, 128], [768, 256]]}
    - id: relay_validation_00
